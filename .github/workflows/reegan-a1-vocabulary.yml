name: Reegan A1 Vocabulary Artwork (daily preparation)
on:
  workflow_dispatch:
  push:
    paths:
      - 'germanwithreegan/automation/**'
      - '.github/workflows/reegan-a1-vocabulary.yml'
  schedule:
    - cron: '15 12 * * *'
permissions:
  contents: write
concurrency:
  group: reegan-a1-artwork-generation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install illustrated icon font and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-color-emoji fonts-dejavu-core
          python -m pip install 'pillow>=11,<13'
      - name: Build bilingual A1 poster batch for today and next two days
        run: python germanwithreegan/automation/generate.py
      - name: Verify generated files before commit
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('germanwithreegan/auto')
          paths=list(root.rglob('post.json'))
          assert paths, 'No post files were generated'
          for p in paths:
              if p.parts[-3]<'2026-11-21':
                  continue # Legacy v1 content is archived and excluded from future posts.
              obj=json.loads(p.read_text('utf8'))
              jpg=p.parent/'01.jpg'
              assert jpg.exists() and jpg.stat().st_size>60000
              assert hashlib.sha256(jpg.read_bytes()).hexdigest()==obj['image_sha256']
              assert len(obj['words'])==6 and len(obj['threads']['text'])<=500
              assert obj['instagram']['mode']=='image' and obj['level']=='A1'
              assert obj['generator_version']=='a1-v2', 'Reject the old text-card design'
          print('Validated',len(paths),'image/manifest pairs')
          PY
      - name: Commit only Reegan auto content
        run: |
          git config user.name 'reegan-vocabulary[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add germanwithreegan/auto
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare dated German with Reegan A1 vocabulary posts'
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep $((i * 2))
            done
            echo 'Could not publish assets after retries' >&2
            exit 1
          fi
