
name: One-time LearnWithReegan approved poster import
on:
  push:
    branches: [assets/gwr-b1-20261120]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/gwr-b1-20261120
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Import approved poster (only if original resolution available)
        env:
          SOURCES_JSON: '{"signed_full":"https://media.canva.com/v2/image-resize/format:PNG/height:1402/quality:100/uri:ifs%3A%2F%2FM%2F05fe6842-2158-45ee-aadd-45a7ac9c408c/watermark:F/width:1122?csig=AAAAAAAAAAAAAAAAAAAAAKgNw6S5A7z4g3T5HVKITqGJGcPOb63fMYYE8L0hMZt-&exp=1795184027&osig=AAAAAAAAAAAAAAAAAAAAAEYu_4i-RZpJXAy3-Esfutx846pwWaiqF7qfJ9w4fqjL&signer=media-rpc&token=AAIAAU0AJDA1ZmU2ODQyLTIxNTgtNDVlZS1hYWRkLTQ1YTdhYzljNDA4YwAAAAABoflOZXgjqMbMw336aXxGve6fK-ZC1tI1l8oyaIjLcizprwcVHg&x-canva-quality=thumbnail","signed_thumbnail":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F05fe6842-2158-45ee-aadd-45a7ac9c408c/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAKgNw6S5A7z4g3T5HVKITqGJGcPOb63fMYYE8L0hMZt-&exp=1795184027&osig=AAAAAAAAAAAAAAAAAAAAAEYu_4i-RZpJXAy3-Esfutx846pwWaiqF7qfJ9w4fqjL&signer=media-rpc&token=AAIAAU0AJDA1ZmU2ODQyLTIxNTgtNDVlZS1hYWRkLTQ1YTdhYzljNDA4YwAAAAABoflOZXgjqMbMw336aXxGve6fK-ZC1tI1l8oyaIjLcizprwcVHg&x-canva-quality=thumbnail","unsigned_full":"https://media.canva.com/v2/image-resize/format:PNG/height:1402/quality:100/uri:ifs%3A%2F%2FM%2F05fe6842-2158-45ee-aadd-45a7ac9c408c/watermark:F/width:1122"}'
        run: |
          python - <<'PY'
          import io,json,os,urllib.request
          from PIL import Image
          import pathlib
          sources=json.loads(os.environ['SOURCES_JSON'])
          best=None
          for label,url in sources.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      content_type=r.headers.get('Content-Type','')
                      body=r.read(12*1024*1024)
                  image=Image.open(io.BytesIO(body))
                  image.load()
                  print(f'{label}: status=200 size={image.size} mime={content_type}')
                  if image.width>=1000 and image.height>=1250:
                      best=image.convert('RGB')
                      break
              except Exception as e:
                  print(f'{label}: unavailable ({type(e).__name__})')
          if best is None:
              print('FULL_RES_NOT_AVAILABLE: leaving source unmodified; do not publish a thumbnail')
              raise SystemExit(0)
          out=pathlib.Path('germanwithreegan/2026-11-20/b1-denken-an')
          out.mkdir(parents=True,exist_ok=True)
          best.save(out/'01.jpg',format='JPEG',quality=90,optimize=True,subsampling=0)
          print('READY_IMAGE:',out/'01.jpg')
          PY
      - name: Commit only verified full-resolution poster
        run: |
          if [ -f germanwithreegan/2026-11-20/b1-denken-an/01.jpg ]; then
            git config user.name 'reegan-assets[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add germanwithreegan/2026-11-20/b1-denken-an/01.jpg
            git diff --cached --quiet || (git commit -m 'Host verified LearnWithReegan B1 poster' && git push origin HEAD:assets/gwr-b1-20261120)
          fi
